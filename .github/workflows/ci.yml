name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: python scripts/check_repo.py
      - run: python scripts/run_tests.py
      - name: Verify release archive and bootstrap
        run: |
          python install.py --help
          python scripts/build_release.py --output "$RUNNER_TEMP/amdl-release"
          digest=$(cut -d ' ' -f 1 "$RUNNER_TEMP/amdl-release/source.tar.gz.sha256")
          python install.py --root "$RUNNER_TEMP/amdl-bootstrap" --archive "$RUNNER_TEMP/amdl-release/source.tar.gz" --sha256 "$digest" --with-media-servers --dry-run
      - name: Verify image source inclusion without downloads
        run: |
          docker build --network=none -f - . <<'DOCKERFILE'
          FROM scratch
          COPY bot/yt_dlp_readonly_cookies.py /app/yt_dlp_readonly_cookies.py
          COPY ops/lyrics_network_policy.py /app/lyrics_network_policy.py
          COPY bot/lyrics_network_policy_runner.py /app/lyrics_network_policy_runner.py
          COPY services/youtube/install_sabr_tool.py /app/install_sabr_tool.py
          COPY services/youtube/SABR_SOURCES.md /notices/SOURCES.md
          COPY licenses/yt-dlp-sabr-Unlicense.txt /notices/LICENSE
          COPY licenses/yt-dlp-sabr-THIRD_PARTY_LICENSES.txt /notices/THIRD_PARTY_LICENSES.txt
          DOCKERFILE
      - name: Validate deployment templates
        env:
          SQ_DB_PASSWORD: ci-config-only
          SQ_DB_ROOT_PASSWORD: ci-config-only-root
          SQ_JWT_SECRET: ci-config-only-jwt
          NAVIDROME_DATA_PATH: /srv/amdl/navidrome
          EMBY_DATA_PATH: /srv/amdl/emby
          LRCAPI_DATA_PATH: /srv/amdl/lrcapi
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.auth-refresh.yaml --profile auth config --quiet
          docker compose -f compose.yaml -f compose.self-heal.yaml --profile self-heal config --quiet
          docker compose -f compose.yaml -f services/lx-music/compose.yaml --profile lx config --quiet
          docker compose -f compose.yaml -f services/sq-music/compose.yaml --profile sq config --quiet
          docker compose -f compose.yaml -f services/lx-music/compose.yaml -f services/sq-music/compose.yaml -f compose.self-heal.yaml -f compose.auth-refresh.yaml --profile lx --profile sq --profile self-heal --profile auth config --quiet
          docker compose -f compose.yaml -f services/lx-music/compose.yaml -f services/sq-music/compose.yaml -f services/media/compose.yaml --profile lx --profile sq --profile navidrome --profile emby --profile lrcapi config --quiet
          for script in ops/stack.sh vm/*.sh services/youtube/*.sh; do bash -n "$script"; done
